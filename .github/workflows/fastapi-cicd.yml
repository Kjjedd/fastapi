name: fastapi CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - ".dockerignore"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECR_REPOSITORY: fast
      MANIFEST_REPO: ${{ secrets.MANIFEST_REPO }}
      IMAGE_TAG: ${{ github.sha }}
      GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
      GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_URI: ${{ secrets.ECR_REGISTRY }}/fast:${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "$IMAGE_URI" \
            --push \
            .

      - name: Update deployment manifest
        env:
          GH_PAT: ${{ secrets.MANIFEST_REPO_PAT }}
          IMAGE_URI: ${{ secrets.ECR_REGISTRY }}/fast:${{ github.sha }}
        run: |
          git clone "https://x-access-token:${GH_PAT}@github.com/${MANIFEST_REPO}.git" manifest-repo
          cd manifest-repo
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("deployment.yaml")
          lines = path.read_text().splitlines()
          for idx, line in enumerate(lines):
              if "image:" in line:
                  lines[idx] = f"          image: {os.environ['IMAGE_URI']}"
                  break
          path.write_text("\n".join(lines) + "\n")
          PY

          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

          if git diff --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi

          git add deployment.yaml
          git commit -m "Deploy fast image ${IMAGE_TAG}"
          git push origin main
